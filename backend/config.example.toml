[artnet]
# Optional: bind the Art-Net Ethernet interface (LongN host NIC, see LongN/data/IP.ini).
# source_ip = "2.20.18.9"

# LongN controller box: U0 drives DMX (motor), U1 drives SPI (pixels); both get the same 512 bytes.
[[artnet.targets]]
unit_id = 1
ip = "2.0.0.101"
universes = [0, 1]

[[artnet.targets]]
unit_id = 2
ip = "2.0.0.102"
universes = [0, 1]

[[artnet.targets]]
unit_id = 3
ip = "2.0.0.103"
universes = [0, 1]

[[artnet.targets]]
unit_id = 4
ip = "2.0.0.104"
universes = [0, 1]

[[artnet.targets]]
unit_id = 5
ip = "2.0.0.105"
universes = [0, 1]

[render]
preset = "preset.example.json"
sequence = "sequence.json"
fps = 40
pixels = 152       # one semicircle: foot -> apex -> foot
unit_count = 5

# Optional; these are the LongN defaults.
[hardware]
color_order = "GRB"
brightness = 0.4        # 0..1, applied to every pixel channel
moon_correction = true  # startup default; feet fade and apex dims while a unit runs at max speed

# Optional; these are the LongN defaults. Channels are 1-based within the 512-byte frame.
[motor]
speed_channel = 457
direction_channel = 458
speeds = { stop = 0, mid = 60, max = 230 }
directions = { cw = 0, ccw = 255 }
rpm = { mid = 130, max = 500 }  # simulator and phase estimate only; mid is an estimate

# Add the actual installation coordinates to enable Open-Meteo weather control.
# [weather]
# latitude = 25.0330
# longitude = 121.5654
# interval_minutes = 15
# cloud_step = 6
# palette = "palette.json"  # 天氣色盤；可在 /palette.html 編輯，不存在時用內建三段
#
# Optional hourly visits: each hour, after the current round ends, play one round
# with the next location's weather, then return to local weather.
# [[weather.visits]]
# name = "東京"
# latitude = 35.6762
# longitude = 139.6503
